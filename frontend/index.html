<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Asset Manager | Gestão de Ativos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 font-sans">
    <div class="min-h-screen flex">
        <aside class="w-64 bg-slate-900 text-white p-6 shadow-xl z-10">
            <h1 class="text-2xl font-bold mb-10 text-blue-500 tracking-wider">IT Manager</h1>
            <nav>
                <ul class="space-y-4 text-sm">
                    <li class="hover:text-blue-400 cursor-pointer transition">Dashboard</li>
                    <li class="text-blue-400 font-semibold border-l-4 border-blue-500 pl-2">Equipamentos</li>
                    <li class="hover:text-blue-400 cursor-pointer transition">Colaboradores</li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 p-10">
            <header class="flex justify-between items-center mb-10">
                <div>
                    <h2 class="text-3xl font-bold text-slate-800">Inventário de Hardware</h2>
                    <p class="text-slate-500 mt-1">Gerencie os ativos e responsáveis da empresa</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="abrirColaboradorModal()" class="bg-emerald-600 text-white px-5 py-2.5 rounded-lg hover:bg-emerald-700 shadow-md transition font-semibold">
                        + Novo Colaborador
                    </button>
                    <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 shadow-md transition font-semibold">
                        + Novo Equipamento
                    </button>
                </div>
            </header>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600">Equipamento</th>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600">Tipo</th>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600">Número de Série</th>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600">Responsável</th>
                            <th class="px-6 py-4 text-sm font-semibold text-slate-600">Status</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center backdrop-blur-sm z-50 transition-all">
        <div class="bg-white p-8 rounded-2xl w-[28rem] shadow-2xl">
            <h3 class="text-2xl font-bold text-slate-800 mb-6">Cadastrar Ativo</h3>
            <form id="asset-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nome do Equipamento</label>
                    <input type="text" id="name" placeholder="Ex: Monitor Dell 24" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Responsável</label>
                    <select id="colaborador-select" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg outline-none transition">
                        <option value="">Nenhum (Disponível no estoque)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Categoria</label>
                    <select id="type" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        <option value="Notebook">Notebook</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Monitor">Monitor</option>
                        <option value="Periférico">Periférico</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Número de Série</label>
                    <input type="text" id="serial" placeholder="SN-12345678" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition font-mono uppercase" required>
                </div>
                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" onclick="document.getElementById('modal').classList.add('hidden')" class="px-5 py-2.5 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition">Cancelar</button>
                    <button type="submit" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-blue-700 shadow-md transition">Salvar Ativo</button>
                </div>
            </form>
        </div>
    </div>

    <div id="colaborador-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 flex items-center justify-center backdrop-blur-sm z-50 transition-all">
        <div class="bg-white p-8 rounded-2xl w-[28rem] shadow-2xl">
            <h3 class="text-2xl font-bold text-slate-800 mb-6">Novo Colaborador</h3>
            <form id="colaborador-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nome Completo</label>
                    <input type="text" id="colab-nome" placeholder="Ex: João Silva" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Departamento</label>
                    <select id="colab-depto" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition">
                        <option value="TI">TI</option>
                        <option value="RH">RH</option>
                        <option value="Financeiro">Financeiro</option>
                        <option value="Vendas">Vendas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="colab-email" placeholder="email@empresa.com" class="w-full border border-slate-300 px-4 py-2.5 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>
                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" onclick="fecharColaboradorModal()" class="px-5 py-2.5 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition">Cancelar</button>
                    <button type="submit" class="bg-emerald-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-emerald-700 shadow-md transition">Salvar Colaborador</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
